<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <defs>
    <radialGradient id="linerPaper" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FAF5EE"/>
      <stop offset="65%" stop-color="#F2E8DC"/>
      <stop offset="100%" stop-color="#E5D8C7"/>
    </radialGradient>
    <linearGradient id="silkShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dacdbd" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bf9d9b" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fondotinta Carta Pregiata Seta Cotone -->
  <rect width="100%" height="100%" fill="url(#linerPaper)"/>
  <rect width="100%" height="100%" fill="url(#silkShimmer)"/>

  <!-- Texture Sottile Micro-Puntinata Amalfi -->
  <pattern id="grain" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.6" fill="#523c2f" opacity="0.08"/>
    <circle cx="8" cy="8" r="0.6" fill="#523c2f" opacity="0.08"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grain)"/>

  <!-- ================= RAMI D'ULIVO (VERDE SALVIA NOBILE #4f523f) ================= -->
  <g stroke="#4f523f" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.75">
    <!-- Ramo Sinistro -->
    <path d="M 50,420 Q 140,320 180,180 T 260,80" />
    <!-- Foglie d'Ulivo Sinistre -->
    <path d="M 110,340 C 90,325 95,305 115,310 C 130,320 125,340 110,340 Z" fill="#4f523f" fill-opacity="0.45"/>
    <path d="M 130,300 C 150,285 160,295 150,315 C 140,325 125,315 130,300 Z" fill="#4f523f" fill-opacity="0.55"/>
    <path d="M 155,240 C 135,225 138,205 160,210 C 175,220 170,240 155,240 Z" fill="#4f523f" fill-opacity="0.45"/>
    <path d="M 180,190 C 205,180 215,190 205,210 C 195,220 180,205 180,190 Z" fill="#4f523f" fill-opacity="0.55"/>
    <path d="M 215,130 C 200,110 210,95 230,105 C 240,115 230,135 215,130 Z" fill="#4f523f" fill-opacity="0.5"/>
    <path d="M 245,95 C 265,80 275,90 268,110 C 260,120 245,110 245,95 Z" fill="#4f523f" fill-opacity="0.6"/>

    <!-- Ramo Destro -->
    <path d="M 550,440 Q 460,330 420,200 T 340,90" />
    <!-- Foglie d'Ulivo Destre -->
    <path d="M 490,350 C 510,335 505,315 485,320 C 470,330 475,350 490,350 Z" fill="#4f523f" fill-opacity="0.45"/>
    <path d="M 470,310 C 450,295 440,305 450,325 C 460,335 475,325 470,310 Z" fill="#4f523f" fill-opacity="0.55"/>
    <path d="M 445,250 C 465,235 462,215 440,220 C 425,230 430,250 445,250 Z" fill="#4f523f" fill-opacity="0.45"/>
    <path d="M 420,200 C 395,190 385,200 395,220 C 405,230 420,215 420,200 Z" fill="#4f523f" fill-opacity="0.55"/>
    <path d="M 385,140 C 400,120 390,105 370,115 C 360,125 370,145 385,140 Z" fill="#4f523f" fill-opacity="0.5"/>
  </g>

  <!-- ================= DALIA PRINCIPALE IN ROSA CIPRIA / BLUSH (#bf9d9b) & BORDEAUX (#530c1e) ================= -->
  <g transform="translate(300, 260) scale(1.15)">
    <!-- Alone Acquerello Blush Morbido -->
    <circle cx="0" cy="0" r="70" fill="#bf9d9b" fill-opacity="0.25" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="45" fill="#530c1e" fill-opacity="0.18" filter="url(#softGlow)"/>

    <!-- Petali Esterni in Rosa Cipria Silk (#bf9d9b) -->
    <g fill="#bf9d9b" fill-opacity="0.55" stroke="#523c2f" stroke-width="0.75" opacity="0.9">
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(22.5)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(45)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(67.5)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(90)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(112.5)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(135)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(157.5)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(180)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(202.5)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(225)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(247.5)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(270)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(292.5)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(315)"/>
      <path d="M0,0 C16,-30 12,-65 0,-75 C-12,-65 -16,-30 0,0" transform="rotate(337.5)"/>
    </g>

    <!-- Petali Intermedi in Velluto Bordeaux (#530c1e) -->
    <g fill="#530c1e" fill-opacity="0.65" stroke="#dacdbd" stroke-width="0.8" opacity="0.95">
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(11.25)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(33.75)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(56.25)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(78.75)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(101.25)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(123.75)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(146.25)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(168.75)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(191.25)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(213.75)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(236.25)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(258.75)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(281.25)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(303.75)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(326.25)"/>
      <path d="M0,0 C12,-20 8,-48 0,-55 C-8,-48 -12,-20 0,0" transform="rotate(348.75)"/>
    </g>

    <!-- Corona di Pistilli Champagne (#dacdbd) & Cuore Corteccia (#523c2f) -->
    <circle cx="0" cy="0" r="16" fill="#dacdbd" stroke="#523c2f" stroke-width="1"/>
    <circle cx="0" cy="0" r="9" fill="#523c2f"/>
    <!-- Punti Polline Oro/Champagne -->
    <g fill="#FAF5EE" opacity="0.9">
      <circle cx="0" cy="-6" r="1.2"/>
      <circle cx="5" cy="-3" r="1.2"/>
      <circle cx="5" cy="3" r="1.2"/>
      <circle cx="0" cy="6" r="1.2"/>
      <circle cx="-5" cy="3" r="1.2"/>
      <circle cx="-5" cy="-3" r="1.2"/>
      <circle cx="0" cy="0" r="1.5" fill="#e5c5a1"/>
    </g>
  </g>

  <!-- ================= BOCCIOLO SATELLITE BLUSH (#bf9d9b) IN ALTO A SINISTRA ================= -->
  <g transform="translate(130, 110) scale(0.65)" opacity="0.85">
    <circle cx="0" cy="0" r="35" fill="#bf9d9b" fill-opacity="0.3" filter="url(#softGlow)"/>
    <g fill="#bf9d9b" fill-opacity="0.6" stroke="#523c2f" stroke-width="0.8">
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(0)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(45)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(90)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(135)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(180)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(225)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(270)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(315)"/>
    </g>
    <circle cx="0" cy="0" r="8" fill="#530c1e"/>
  </g>

  <!-- ================= BOCCIOLO SATELLITE BLUSH (#bf9d9b) IN ALTO A DESTRA ================= -->
  <g transform="translate(470, 120) scale(0.55)" opacity="0.8">
    <circle cx="0" cy="0" r="30" fill="#bf9d9b" fill-opacity="0.3" filter="url(#softGlow)"/>
    <g fill="#bf9d9b" fill-opacity="0.6" stroke="#523c2f" stroke-width="0.8">
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(20)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(80)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(140)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(200)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(260)"/>
      <path d="M0,0 C12,-18 9,-38 0,-44 C-9,-38 -12,-18 0,0" transform="rotate(320)"/>
    </g>
    <circle cx="0" cy="0" r="7" fill="#530c1e"/>
  </g>
</svg>
